name: Daily Telegram News Digest

on:
  schedule:
    # 13:00 UTC = 9:00 AM ET during US daylight saving time (EDT, UTC-4).
    # GitHub Actions cron does not follow DST — switch to "0 14 * * *" once
    # the US falls back to standard time (EST, UTC-5) in early November,
    # and back to "0 13 * * *" when DST resumes in March, to keep 9:00 AM ET.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scheduled.py
